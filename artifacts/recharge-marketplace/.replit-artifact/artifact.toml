kind = "web"
previewPath = "/"
title = "Recharge Marketplace"
description = "A faithful React prototype of the Recharge marketplace homepage shown in the supplied reference image, with browsable categories, trending deals, location selection, favorites, and promotional content tiles."
version = "1.0.0"
id = "artifacts/recharge-marketplace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23713

[services.development]
run = "pnpm --filter @workspace/recharge-marketplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/recharge-marketplace", "run", "build" ]
serve = "static"
publicDir = "artifacts/recharge-marketplace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23713"
BASE_PATH = "/"
